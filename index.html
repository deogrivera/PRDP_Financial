<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obligation & Disbursement · PRDP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #fafafa;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      color: #1e1e1e;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    /* header – minimal, just logo */
    .site-header {
      padding: 2rem 0 1.5rem 0;
      border-bottom: 1px solid #eaeaea;
    }

    .site-header .container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo {
      font-weight: 500;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: #111;
    }

    .logo span {
      font-weight: 300;
      color: #4f4f4f;
    }

    /* hero – centered, two clear action cards */
    .hero {
      padding: 3.5rem 0 3rem 0;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .hero .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 350;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 0.75rem;
      max-width: 800px;
    }

    .hero h1 strong {
      font-weight: 500;
      background: linear-gradient(135deg, #1a1a1a 0%, #3d3d3d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero .subhead {
      font-size: 1.15rem;
      color: #3d3d3d;
      max-width: 560px;
      margin: 0 auto 2.5rem auto;
      font-weight: 350;
    }

    /* action cards */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
    }

    .action-card {
      background: white;
      border-radius: 28px;
      padding: 2.5rem 2rem 2.2rem 2rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.02), 0 1px 3px rgba(0, 0, 0, 0.05);
      border: 1px solid #f0f0f0;
      transition: transform 0.2s, box-shadow 0.25s, border-color 0.2s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .action-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.04);
      border-color: #d0d0d0;
    }

    .action-card .icon {
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 1rem;
    }

    .action-card h2 {
      font-weight: 500;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .action-card p {
      color: #4a4a4a;
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
      font-weight: 350;
      line-height: 1.5;
    }

    .btn-card {
      display: inline-block;
      padding: 0.7rem 2.2rem;
      background: #1a1a1a;
      color: white;
      border-radius: 40px;
      font-weight: 450;
      font-size: 0.95rem;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
      border: 1px solid #1a1a1a;
      letter-spacing: 0.01em;
      margin-top: auto;
    }

    .btn-card:hover {
      background: #333;
      border-color: #333;
      transform: scale(0.97);
    }

    .btn-card-outline {
      background: transparent;
      color: #1a1a1a;
      border: 1px solid #b0b0b0;
    }

    .btn-card-outline:hover {
      background: #f4f4f4;
      border-color: #7a7a7a;
    }

    /* footer – ultra minimal */
    .site-footer {
      margin-top: auto;
      padding: 1.5rem 0 2rem 0;
      border-top: 1px solid #ececec;
      background: #fafafa;
      text-align: center;
    }

    .site-footer .container {
      font-size: 0.85rem;
      color: #7a7a7a;
    }

    /* responsive */
    @media (max-width: 680px) {
      .hero h1 {
        font-size: 2.2rem;
      }

      .action-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
        max-width: 400px;
      }

      .site-header .container {
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .hero h1 {
        font-size: 1.8rem;
      }

      .action-card {
        padding: 2rem 1.5rem;
      }

      .action-card .icon {
        font-size: 2.5rem;
      }

      .action-card h2 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- header – just logo -->
  <header class="site-header">
    <div class="container">
      <div class="logo">
        oblig<span>·</span>disburse
      </div>
    </div>
  </header>

  <!-- main hero -->
  <main>
    <section class="hero">
      <div class="container">
        <h1>
          <strong>Obligation</strong> &amp; <strong>Disbursement</strong>
        </h1>
        <p class="subhead">
          PRDP financial monitoring dashboards
        </p>

        <!-- two action cards -->
        <div class="action-grid">
          <!-- Obligation -->
          <a href="https://deogrivera.github.io/PRDP_Obligation/" class="action-card" target="_blank" rel="noopener noreferrer">
            <div class="icon">📋</div>
            <h2>Obligation</h2>
            <p>Earmarked balances, reconciliation, and aging overview.</p>
            <span class="btn-card">Open Dashboard →</span>
          </a>

          <!-- Disbursement -->
          <a href="https://deogrivera.github.io/PRDP_Disbursement/" class="action-card" target="_blank" rel="noopener noreferrer">
            <div class="icon">💸</div>
            <h2>Disbursement</h2>
            <p>Performance ledger, rates, and unpaid balances.</p>
            <span class="btn-card btn-card-outline">Open Dashboard →</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <!-- footer – minimal -->
  <footer class="site-footer">
    <div class="container">
      <span>© 2026 · Obligation &amp; Disbursement</span>
    </div>
  </footer>

</body>
</html>
